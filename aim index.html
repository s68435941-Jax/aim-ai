<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AIM-AI // 軌跡追蹤</title>
    <style>
        body { background: #0a0c10; color: #e2e8f0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .box { background: #141822; padding: 30px; border-radius: 12px; border: 1px solid #00f0ff; width: 90%; max-width: 600px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #05070b; border: 1px solid #00f0ff; color: white; border-radius: 6px; }
        .btn { width: 100%; padding: 12px; background: #0072ff; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; }
        #game-area { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #05070b; }
        #gameCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        #ui-text { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); pointer-events: none; color: #00f0ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="box" id="main-panel">
    <div id="page1">
        <h1>Aim-AI 軌跡版</h1>
        <input type="number" id="dpi" value="800" placeholder="滑鼠 DPI">
        <input type="number" id="sens" value="1.0" step="0.1" placeholder="遊戲內靈敏度">
        <button class="btn" id="start-btn">進入軌跡追蹤靶場</button>
    </div>

    <div id="page3" style="display:none;">
        <h2>📊 軌跡動態優化報告</h2>
        <div style="border-left: 4px solid #00f0ff; background: rgba(0,240,255,0.05); padding: 15px; margin: 15px 0; text-align: left;">
            <div id="c-title" style="font-weight:bold; color:#00f0ff;"></div>
            <div id="c-text" style="margin-top:5px;"></div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <div style="flex:1; background:rgba(255,255,255,0.02); padding:10px; border-radius:6px;">抖動率: <b id="v-jitter" style="color:#ff3333">0%</b></div>
            <div style="flex:1; background:rgba(255,255,255,0.02); padding:10px; border-radius:6px;">平滑度: <b id="v-smooth" style="color:#39ff14">0%</b></div>
        </div>
        <table>
            <thead><tr><th>遊戲</th><th>推薦靈敏度</th><th>DPI</th></tr></thead>
            <tbody id="res-table"></tbody>
        </table>
        <button class="btn" id="retry-btn" style="margin-top: 15px; background: #334155;">重新測試</button>
    </div>
</div>

<div id="game-area">
    <div id="ui-text"><h2 style="font-size:1.5rem;">進度: <span id="count">0</span> / 50</h2></div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const panel = document.getElementById('main-panel'), p1 = document.getElementById('page1'), p3 = document.getElementById('page3'), p2 = document.getElementById('game-area');
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d'), uiCount = document.getElementById('count');
    let currentDpi = 800, currentSens = 1.0, shotCount = 0, totalShots = 50, mousePos = { x: 0, y: 0 }, lastPos = { x: 0, y: 0 }, target = { x: 0, y: 0, r: 16 }, overC = 0, underC = 0, traj = [], metrics = [];

    function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = initCanvas;

    document.getElementById('start-btn').onclick = function() {
        currentDpi = parseFloat(document.getElementById('dpi').value) || 800;
        currentSens = parseFloat(document.getElementById('sens').value) || 1.0;
        panel.style.display = 'none'; p2.style.display = 'block'; initCanvas();
        shotCount = 0; overC = 0; underC = 0; metrics = []; uiCount.innerText = 0;
        lastPos.x = canvas.width / 2; lastPos.y = canvas.height / 2;
        traj = [{x: lastPos.x, y: lastPos.y}]; spawn();
    };

    canvas.onmousemove = function(e) {
        mousePos.x = e.clientX; mousePos.y = e.clientY;
        traj.push({ x: mousePos.x, y: mousePos.y }); draw();
    };

    canvas.onmousedown = function() {
        if (shotCount >= totalShots) return;
        let ideal = Math.sqrt((target.x - lastPos.x)**2 + (target.y - lastPos.y)**2);
        let actual = Math.sqrt((mousePos.x - lastPos.x)**2 + (mousePos.y - lastPos.y)**2);
        if (actual > ideal) { overC++; } else { underC++; }
        
        // 軌跡分析
        if (traj.length > 2 && ideal > 0) {
            let dev = 0, jit = 0, A = mousePos.y - lastPos.y, B = lastPos.x - mousePos.x, C = mousePos.x * lastPos.y - lastPos.x * mousePos.y, len = Math.sqrt(A*A + B*B), lastD = 0;
            for (let i = 1; i < traj.length; i++) {
                let d = len > 0 ? Math.abs(A * traj[i].x + B * traj[i].y + C) / len : 0; dev += d;
                if (i > 1 && ((d - lastD) * (d - (dev/(i+1))) < 0)) jit++;
                lastD = d;
            }
            let pathLen = 0;
            for(let i=1; i<traj.length; i++) pathLen += Math.sqrt((traj[i].x - traj[i-1].x)**2 + (traj[i].y - traj[i-1].y)**2);
            metrics.push({ jit: (jit / traj.length) * 100, sm: pathLen > 0 ? (ideal / pathLen) * 100 : 100 });
        }

        lastPos.x = mousePos.x; lastPos.y = mousePos.y; shotCount++; uiCount.innerText = shotCount;
        if (shotCount >= totalShots) { p2.style.display = 'none'; panel.style.display = 'block'; p3.style.display = 'block'; report(); } 
        else { traj = [{x: mousePos.x, y: mousePos.y}]; spawn(); }
    };

    function spawn() {
        let maxW = canvas.width - 60, maxH = canvas.height - 60, ok = false;
        while (!ok) {
            target.x = 40 + Math.random() * (maxW - 60); target.y = 100 + Math.random() * (maxH - 140);
            if (Math.sqrt((target.x - lastPos.x)**2 + (target.y - lastPos.y)**2) > 150) ok = true;
        }
        draw();
    }

    function draw() {
        ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.02)';
        for (let i = 0; i < canvas.width; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        if (shotCount < totalShots) {
            ctx.beginPath(); ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 51, 51, 0.85)'; ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.stroke();
        }
    }

    function report() {
        let avgJ = 0, avgS = 0; metrics.forEach(m => { avgJ += m.jit; avgS += m.sm; });
        avgJ = metrics.length > 0 ? avgJ / metrics.length : 0; avgS = metrics.length > 0 ? avgS / metrics.length : 0;
        document.getElementById('v-jitter').innerText = avgJ.toFixed(1) + "%";
        document.getElementById('v-smooth').innerText = avgS.toFixed(1) + "%";
        
        let mod = 1.0, t = document.getElementById('c-title'), txt = document.getElementById('c-text');
        if (avgJ > 38 && overC >= totalShots * 0.4) { mod = 0.80; t.innerText = "⚠️ AI 會診：高解析度抖動 × 肌肉嚴重過衝"; txt.innerText = "微抖動頻率過高，且甩槍明顯衝過頭，強烈建議降低遊戲內靈敏度！"; } 
        else if (avgS < 75 && underC >= totalShots * 0.5) { mod = 1.15; t.innerText = "⚠️ AI 會診：拉槍路線曲折 × 移動力道不足"; txt.innerText = "拉槍路線出現多次變向修正且力道不足，建議調高速度讓拉槍一筆劃到位。"; } 
        else if (overC >= totalShots * 0.55) { mod = 0.85; t.innerText = "⚠️ AI 會診：整體操作速度偏快"; txt.innerText = "煞車時機偏晚導致容易衝出紅點，建議微調低靈敏度提高爆頭率。"; } 
        else if (underC >= totalShots * 0.55) { mod = 1.15; t.innerText = "⚠️ AI 會診：拉槍制動提早，速度偏慢"; txt.innerText = "控槍雖穩但拉槍容易提早停下，需要二次微調，請適度調快速度。"; } 
        else { mod = 1.0; t.innerText = "🎯 AI 會診：完美的人馬合一狀態！"; txt.innerText = "拉槍軌跡平滑且控制極穩，過衝與不足次數完美均衡，維持原數值即可！"; }

        let finalS = currentSens * mod;
        document.getElementById('res-table').innerHTML = `
            <tr><td><b>CS2</b></td><td style="color:#39ff14;font-weight:bold;">${(finalS * 1.0).toFixed(2)}</td><td>${currentDpi}</td></tr>
            <tr><td><b>WARDOGS</b></td><td style="color:#00f0ff;font-weight:bold;">${(finalS * 0.45 * 1.15).toFixed(2)}</td><td>${currentDpi}</td></tr>
            <tr><td><b>Valorant</b></td><td style="color:#39ff14;font-weight:bold;">${(finalS * 0.314).toFixed(2)}</td><td>${currentDpi}</td></tr>
            <tr><td><b>Apex / COD</b></td><td style="color:#00f0ff;font-weight:bold;">${(finalS * 3.18 * 1.15).toFixed(2)}</td><td>${currentDpi}</td></tr>`;
    }

    document.getElementById('retry-btn').onclick = function() { p3.style.display = 'none'; p1.style.display = 'block'; };
</script>
</body>
</html>
